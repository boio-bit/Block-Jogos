<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Block Jogos</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="particles"></div>

<div class="container">

  <div class="card">

    <h1>BLOCK JOGOS</h1>

    <!-- TABS -->
    <div class="tabs">
      <button onclick="showLogin()">Entrar</button>
      <button onclick="showRegister()">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <div id="loginBox">

      <input id="loginEmail" type="email" placeholder="Gmail">
      <input id="loginPassword" type="password" placeholder="Senha">

      <button onclick="login()">Entrar</button>

    </div>

    <!-- REGISTER -->
    <div id="registerBox" class="hidden">

      <input id="regEmail" type="email" placeholder="Gmail">
      <input id="regPassword" type="password" placeholder="Senha">
      <input id="regConfirm" type="password" placeholder="Confirmar senha">

      <div class="terms">
        <input type="checkbox" id="termsCheck">
        <label>
          Concordo com os
          <a href="terms.html" target="_blank">termos</a>
        </label>
      </div>

      <button onclick="register()">Criar conta</button>

    </div>

    <p id="msg"></p>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>
<script src="particles.js"></script>

</body>
</html>
