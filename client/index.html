<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Jogos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: white;
  overflow: hidden;
}

#particles {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 340px;
  padding: 25px;
  border-radius: 15px;
  background: rgba(0,0,0,0.8);
  border: 1px solid #ff003c;
  text-align: center;
}

h1 {
  color: #ff003c;
  text-shadow: 0 0 10px #ff003c;
}

input {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: none;
  background: #111;
  color: white;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  background: #ff003c;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  transform: scale(1.03);
}

.tabs {
  display: flex;
  gap: 5px;
}

.tabs button {
  width: 50%;
  background: transparent;
  border: 1px solid #ff003c;
}

.hidden {
  display: none;
}

#msg {
  font-size: 12px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="container">

  <div class="card">

    <h1>BLOCK JOGOS</h1>

    <!-- TABS -->
    <div class="tabs">
      <button onclick="showLogin()">Entrar</button>
      <button onclick="showRegister()">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <div id="loginBox">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Senha">
      <button onclick="login()">Entrar</button>
    </div>

    <!-- REGISTER -->
    <div id="registerBox" class="hidden">
      <input id="email2" type="email" placeholder="Email">
      <input id="password2" type="password" placeholder="Senha">
      <input id="confirm" type="password" placeholder="Confirmar senha">

      <label>
        <input type="checkbox" id="terms">
        Concordo com os <a href="terms.html" target="_blank">termos</a>
      </label>

      <button onclick="register()">Criar conta</button>
    </div>

    <p id="msg"></p>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
// ================= SUPABASE =================
const supabaseUrl = "https://hwffqfjimqjrapzesbaa.supabase.co";
const supabaseKey = "SUA_KEY_AQUI";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// ================= UI =================
function showLogin() {
  loginBox.classList.remove("hidden");
  registerBox.classList.add("hidden");
}

function showRegister() {
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
}

function msg(t) {
  document.getElementById("msg").innerText = t;
}

// ================= LOGIN =================
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) return msg("Erro no login");

  msg("Login OK 🚀");

  setTimeout(() => {
    window.location.href = "/dashboard.html";
  }, 800);
}

// ================= REGISTER =================
async function register() {
  const email = document.getElementById("email2").value;
  const password = document.getElementById("password2").value;
  const confirm = document.getElementById("confirm").value;
  const terms = document.getElementById("terms").checked;

  if (password !== confirm) return msg("Senhas não coincidem");
  if (!terms) return msg("Aceite os termos");

  const { error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) return msg("Erro ao criar conta");

  msg("Conta criada! Verifique seu email 🚀");

  setTimeout(() => {
    showLogin();
  }, 1200);
}

// ================= PARTICLES SIMPLES =================
window.onload = () => {
  const canvas = document.createElement("canvas");
  document.getElementById("particles").appendChild(canvas);
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  let p = [];

  for (let i = 0; i < 60; i++) {
    p.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      s: Math.random() * 1.5
    });
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#ff003c";

    p.forEach(p1 => {
      ctx.beginPath();
      ctx.arc(p1.x,p1.y,2,0,Math.PI*2);
      ctx.fill();

      p1.y += p1.s;

      if (p1.y > innerHeight) {
        p1.y = 0;
      }
    });

    requestAnimationFrame(draw);
  }

  draw();
};
</script>

</body>
</html>
