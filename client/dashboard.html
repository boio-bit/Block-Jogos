<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard - Block Jogos</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: white;
  text-align: center;
}

.container {
  padding: 50px;
}

h1 {
  color: #ff003c;
  text-shadow: 0 0 10px #ff003c;
}

.card {
  background: rgba(0,0,0,0.7);
  border: 1px solid #ff003c;
  padding: 20px;
  border-radius: 12px;
  display: inline-block;
  box-shadow: 0 0 20px #ff003c33;
}

button {
  margin-top: 20px;
  padding: 10px;
  width: 200px;
  border: none;
  border-radius: 8px;
  background: #ff003c;
  color: white;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">

  <h1>BLOCK JOGOS</h1>

  <div class="card">
    <p>Você está logado 🚀</p>

    <button onclick="logout()">Sair</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseUrl = "https://hwffqfjimqjrapzesbaa.supabase.co";
const supabaseKey = "SUA_KEY_AQUI";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// 🔥 PROTEÇÃO (se não estiver logado volta pro login)
(async () => {
  const { data } = await supabase.auth.getSession();

  if (!data.session) {
    window.location.href = "index.html";
  }
})();

// 🔥 LOGOUT
async function logout() {
  await supabase.auth.signOut();
  window.location.href = "index.html";
}
</script>

</body>
